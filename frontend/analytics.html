<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Darukaa.Earth - Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7f5;
            color: #26352d;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #123d2b;
            color: white;
            padding: 25px 15px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 35px;
        }

       .nav-item {
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .nav-item:hover,
        .nav-item.active {
            background: #286044;
        }

        .main {
            margin-left: 230px;
            padding: 35px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6d786f;
            margin-bottom: 30px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card-title {
            color: #6d786f;
            margin-bottom: 10px;
        }

        .value {
            font-size: 28px;
            font-weight: bold;
            color: #145c3a;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .chart-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .chart-card h2 {
            margin-bottom: 20px;
            font-size: 19px;
        }
    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="nav-item " onclick="window.location.href='home.html'">
    📊 Dashboard
</div>

<div class="nav-item" onclick="window.location.href='projects.html'">
    🏆 Projects
</div>

<div class="nav-item" onclick="window.location.href='sites.html'">
    📍 Sites
</div>

<div class="nav-item active" onclick="window.location.href='analytics.html'">
    📊 Analytics
</div>

<div class="nav-item" onclick="window.location.href='settings.html'">
    ⚙️ Settings
</div>

    </aside>


    <main class="main">

        <h1>Environmental Analytics</h1>

        <p class="subtitle">
            Environmental performance of the Western Ghats Restoration project.
        </p>

        <div class="cards">

            <div class="card">
                <div class="card-title">Total Sites</div>
                <div class="value" id="totalSites">0</div>
            </div>

            <div class="card">
                <div class="card-title">Carbon Stored</div>
                <div class="value" id="totalCarbon">0 t</div>
            </div>

            <div class="card">
                <div class="card-title">Average Biodiversity</div>
                <div class="value" id="avgBiodiversity">0 / 100</div>
            </div>

        </div>

        <div class="charts">

            <div class="chart-card">
                <h2>Carbon Storage</h2>
                <canvas id="carbonChart"></canvas>
            </div>

            <div class="chart-card">
                <h2>Biodiversity Performance</h2>
                <canvas id="biodiversityChart"></canvas>
            </div>

        </div>

    </main>

    <script>

        fetch("http://127.0.0.1:5000/api/sites")
            .then(response => response.json())
            .then(sites => {

                const totalCarbon = sites.reduce(
                    (sum, site) =>
                        sum + Number(site.carbon_stored || 0), 0
                );

                const biodiversity = sites
                    .map(site => Number(site.biodiversity_score))
                    .filter(value => !isNaN(value));

                const averageBiodiversity =
                    biodiversity.length
                        ? biodiversity.reduce((a, b) => a + b, 0)
                          / biodiversity.length
                        : 0;

                document.getElementById("totalSites").textContent =
                    sites.length;

                document.getElementById("totalCarbon").textContent =
                    totalCarbon.toFixed(2) + " t";

                document.getElementById("avgBiodiversity").textContent =
                    averageBiodiversity.toFixed(1) + " / 100";

                new Chart(
                    document.getElementById("carbonChart"),
                    {
                        type: "bar",

                        data: {
                            labels: sites.map(site => site.name),

                            datasets: [{
                                label: "Carbon Stored (tonnes)",
                                data: sites.map(site =>
                                    Number(site.carbon_stored || 0)
                                )
                            }]
                        },

                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    }
                );

                new Chart(
                    document.getElementById("biodiversityChart"),
                    {
                        type: "bar",

                        data: {
                            labels: sites.map(site => site.name),

                            datasets: [{
                                label: "Biodiversity Score",
                                data: sites.map(site =>
                                    Number(site.biodiversity_score || 0)
                                )
                            }]
                        },

                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 100
                                }
                            }
                        }
                    }
                );

            })
            .catch(error => {
                console.error("Unable to load analytics:", error);
            });

    </script>

</body>
</html>
